    <script>
        // Marker and Distance Variables
        let currentMarkers = [];
        const coordinatesElement = document.getElementById('coordinates');
        // let buildingDistances = {}; // Store distances between markers and buildings

        // Spawn button
        document.querySelector('.spawnMarker').addEventListener('click', function() {
            const marker = new mapboxgl.Marker({
                draggable: true
            })
            .setLngLat(map.getCenter())
            .addTo(map);

            // Generate a unique ID for each marker 
            const markerId = `marker-${Date.now()}`;
            marker.markerId = markerId;  

            // Store reference with the ID
            currentMarkers.push(marker);

            // Add drag and drop functionality
            marker.on('dragend', function() {
                const lngLat = marker.getLngLat();
                coordinatesElement.style.display = 'block';
                coordinatesElement.innerHTML = `Longitude: ${lngLat.lng.toFixed(5)}<br />Latitude: ${lngLat.lat.toFixed(5)}`;
                // calculateDistances(lngLat, markerId); 
                calculateClosestMarkerForBuildings();

                if (heatmapVisible) addHeatmapLayer();
            });

            // Show coordinates and calculate distances initially
            const initialLngLat = marker.getLngLat();
            coordinatesElement.style.display = 'block';
            coordinatesElement.innerHTML = `Longitude: ${initialLngLat.lng.toFixed(5)}<br />Latitude: ${initialLngLat.lat.toFixed(5)}`;
            // calculateDistances(initialLngLat, markerId);
            calculateClosestMarkerForBuildings();

            if (heatmapVisible) addHeatmapLayer();
        });

        */

        let closestMarkers = {}; // Object to store closest markers and their distances

        // Function to calculate distances between all markers and each building
        function calculateClosestMarkerForBuildings() {
            locations.forEach(location => {
                const buildingCoords = location.coordinates; // [lat, lng]
                let closestDistance = Infinity; // Initialize with a large number
                let closestMarkerId = null; // To store the ID of the closest marker

                currentMarkers.forEach(marker => {
                    const markerLngLat = marker.getLngLat();
                    const distance = turf.distance(
                        turf.point([markerLngLat.lng, markerLngLat.lat]),
                        turf.point([buildingCoords[1], buildingCoords[0]])
                    );

                    // Update closest marker if this distance is smaller
                    if (distance < closestDistance) {
                        closestDistance = distance;
                        closestMarkerId = marker.markerId; // Assign closest marker's ID
                    }
                });

                // Store the closest marker and its distance for the building
                closestMarkers[location.title] = {
                    closestMarkerId: closestMarkerId,
                    distance: closestDistance
                };
            });

            console.log(closestMarkers);
        }

        // Clear button
        document.querySelector('.clearMarker').addEventListener('click', function() {
            currentMarkers.forEach(marker => marker.remove());
            currentMarkers = [];
            closestMarkers = {};
            coordinatesElement.style.display = 'none';
        });

    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Fetch data 
            fetch('/data/markers')
                .then(response => response.json())
                .then(data => {
                    locations = data.results.map(location => ({
                        id: location.locationid,
                        title: location.title,
                        coordinates: location.latlng // [lat, lng]
                    }))
                    .sort((a, b) => a.title.localeCompare(b.title)); // Sort
                    
                    console.log(locations);  
                })
                .catch(error => console.error('Error loading locations:', error));
        
            const searchInput = document.getElementById('locationSearch');
            const dropdownMenu = document.getElementById('locationDropdown');
        
            // Update dropdown menu
            function updateDropdown(searchTerm) {
                dropdownMenu.innerHTML = '';  
                
                let filteredLocations;
                if (searchTerm) {
                    // Filter based on search
                    filteredLocations = locations.filter(location =>
                        location.title.toLowerCase().includes(searchTerm.toLowerCase())
                    );
                } else {
                    // Drop down menu 
                    filteredLocations = locations;
                }
        
                if (filteredLocations.length === 0) {
                    dropdownMenu.style.display = 'none';
                    return;
                }
        
                filteredLocations.forEach(location => {
                    const option = document.createElement('div');
                    option.classList.add('dropdown-item');
                    option.textContent = location.title;
                    option.dataset.id = location.id; // Store ID
                    option.dataset.campus = location.campus; // Store Campus
                    option.dataset.lat = location.coordinates[0]; // Store Latitude
                    option.dataset.lng = location.coordinates[1]; // Store Longitude
        
                    option.addEventListener('click', function () {
                        searchInput.value = location.title;  
                        dropdownMenu.style.display = 'none';  
                        
                        // Log selected location's coordinates
                        console.log(`Selected Location: ${location.title}`);
                        console.log(`Coordinates: ${location.coordinates[0]}, ${location.coordinates[1]}`);
                        
                        // move
                        flyToLocation(location.coordinates);
                    });
        
                    dropdownMenu.appendChild(option);
                });
        
                dropdownMenu.style.display = 'block';  
            }
        
            // Fly + add marker
            let currMarkers = [];
            function flyToLocation(coordinates) {
                currMarkers.forEach(marker => marker.remove());
                currMarkers = [];

                const [lat, lng] = coordinates; 
                map.flyTo({ center: [lng, lat], zoom: 15 });  

                const marker = new mapboxgl.Marker({color: "#FF0000"}).setLngLat([lng, lat]).addTo(map);

                currMarkers.push(marker);
            }

            // Focus 
            searchInput.addEventListener('focus', function () {
                updateDropdown(this.value);
            });
        
            // Input 
            searchInput.addEventListener('input', function () {
                updateDropdown(this.value);
            });
        
            // Hide dropdown
            document.addEventListener('click', function (event) {
                if (!searchInput.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    dropdownMenu.style.display = 'none';
                }
            });
        });
    </script>

        <script>

        // Maintain resource input syncing functions
        function syncSlider(id) {
            const slider = document.getElementById(id);
            const input = document.getElementById(id + '_input');
            input.value = slider.value;

            if (id === 'C_bar_init') {
                localStorage.setItem('C_bar_init', slider.value);
            }
        }

        function syncInput(id) {
            const input = document.getElementById(id + '_input');
            const slider = document.getElementById(id);

            if (id === 'total_layers') {
                let value = parseInt(input.value);
                if (value < 1) value = 1;
                if (value > 2) value = 2;
                setLayer(value); // Ensure buttons update
            } else {
                slider.value = input.value;
            }
        }

        function toggleLayer(layerName) {
            var visibility = map.getLayoutProperty(layerName, 'visibility');
            if (visibility === 'visible') {
                map.setLayoutProperty(layerName, 'visibility', 'none');
            } else {
                map.setLayoutProperty(layerName, 'visibility', 'visible');
            }
        }

    <script>

        let studentDensityData = {};
        let currentTime = "8:00";; // Default hour
        let currentWeekday = "Monday";

        // Fetch CSV Data from Flask API
        fetch('/api/student-density')
            .then(response => response.json())
            .then(data => {
                    studentDensityData = data;
                    //console.log("Fetched Data:", studentDensityData);
                    processCSVData(studentDensityData);
                })
            .catch(error => console.error('Error fetching CSV data:', error));

        // Process CSV Data and Convert to GeoJSON
        function processCSVData(data) {
            let geoJSONData = {}; // Initialize the structured dataset

            data.forEach(row => {
                const { Building, Time, Weekday, Student_Count_Building } = row;

                if (!geoJSONData[Weekday]) {
                    geoJSONData[Weekday] = {}; // Initialize the weekday if not present
                }

                if (!geoJSONData[Weekday][Time]) {
                    geoJSONData[Weekday][Time] = {}; // Initialize time slot if not present
                }

                // Store student count for the building inside the respective time slot
                geoJSONData[Weekday][Time][Building] = Student_Count_Building;
            });

            studentDensityData = geoJSONData;
            //console.log('Processed CSV Data (GeoJSON): ', studentDensityData);
        }

        function addHeatmapLayer() {

            let timeKey = currentTime;
            let weekdayKey = currentWeekday;

            //console.log("Time Key: ", timeKey);
            //console.log("Weekday Key: ", weekdayKey);

            let rawData = studentDensityData[weekdayKey] && studentDensityData[weekdayKey][timeKey] ? studentDensityData[weekdayKey][timeKey] : {};
            
            //console.log("Features to be added to heatmap:", rawData);

            if (!map.getSource('buildings-heatmap')) {
                map.addSource('buildings-heatmap', {
                    'type': 'vector',
                    'url': 'mapbox://quicksid.cm77rz6ea18ut1no0bvytqdiz-4e2lh'
                });

                map.addLayer({
                id: "buildings-layer",
                type: "fill",
                source: "buildings-heatmap",
                "source-layer": "ub_heatmap",
                paint: {
                    "fill-color": "grey",
                    "fill-opacity": 0.4
                    }
                });
            }

            let buildingFeatures = map.querySourceFeatures('buildings-heatmap', {
                sourceLayer: 'ub_heatmap',
            });


            let features = buildingFeatures.map(feature => {
                let studentCount = rawData[feature.properties.id] || 0;
                let buildingName = feature.properties.building;
                let closestMarkerInfo = closestMarkers[buildingName];
                let distance = closestMarkerInfo ? closestMarkerInfo.distance : Infinity;
                let risk = 0;

                // (0.7*(1-e^(-300d/64))+0.2) * s

                if (distance !== Infinity && distance !== undefined) {
                    // risk = studentCount * distance;
                    risk = ((0.7 * (1 - Math.E ** ((-300 * distance)/64)) + 0.2) * studentCount);
                }

                return {
                    type: "Feature",
                    geometry: {
                        type: "Polygon",
                        coordinates: feature.geometry.coordinates // Ensure this is properly retrieved
                    },
                    properties: {
                        count: risk || 0, // Ensure count is a valid number
                        building_name: buildingName || "Unknown",
                        studentCount: studentCount || 0,
                        distance: distance !== Infinity ? distance : 0
                    }
                };


                console.log("geometry type:", buildingFeatures[0].geometry.type);
                console.log("geometry coordinates:", buildingFeatures[0].geometry.coordinates[0]);

            }).filter(feature => feature !== null); // Remove null entries

            if (!map.getSource('heatmap')) {
                map.addSource('heatmap', {
                    type: 'geojson',
                    data: {
                        type: "FeatureCollection",
                        features: features || []
                    }
                });

                //console.log(map.getSource('heatmap'));

                map.addLayer({
                    id: 'heatmap-radial',
                    type: 'heatmap',
                    source: 'heatmap',
                    minzoom: 0,
                    maxzoom: 16,
                    paint: {
                        "heatmap-weight": [
                            "interpolate",
                            ["linear"],
                            ["get", "count"],
                            0, 0,
                            1000, 1
                        ],
                        "heatmap-intensity": 1,
                        "heatmap-color": [
                            "interpolate",
                            ["linear"],
                            ["heatmap-density"],
                            0, "rgba(255,255,255,0)",
                            0.2, "blue",
                            0.4, "cyan",
                            0.6, "lime",
                            0.8, "yellow",
                            1, "red"
                        ],
                        "heatmap-radius": [
                            "interpolate",
                            ["linear"],
                            ["zoom"],
                            0, 5,
                            15, 25
                        ],
                        "heatmap-opacity": 0.7
                    }
                });

                map.addLayer({
                    id: 'heatmap-buildings',
                    type: 'fill',
                    source: 'heatmap',
                    minzoom: 16,
                    maxzoom: 22,
                    paint: {
                        'fill-color': [
                            "interpolate",
                            ["linear"],
                            ["get", "count"],
                            0, "#FFFFFF",
                            50, "#203A7C",
                            100, "#4E6DBD",
                            200, "#509BC7",
                            300, "#F0D55E",
                            500, "#FF972D",
                            700, "#E07069",
                            1000, "#C7445D"
                        ],
                    'fill-opacity': [
                        "case",
                        ["==", ["get", "count"], 0], 0,
                        1
                        ]
                    }
                });

                map.addLayer({
                    id: "heatmap-buildings-labels",
                    type: "symbol",
                    source: "heatmap",
                    minzoom: 16,
                    layout: {
                        "text-field": ["get", "building_name"],
                        "text-font": ["Open Sans Bold", "Arial Unicode MS Bold"],
                        "text-size": 10,
                        "text-anchor": "center"
                    },
                    paint: {
                        "text-color": "#000000",
                        "text-halo-color": "#FFFFFF",
                        "text-halo-width": 0.5
                    }
                });

                map.on('zoom', () => {
                    let zoomLevel = map.getZoom();
                    
                    if (zoomLevel >= 16) {
                        map.setPaintProperty('buildings-layer', 'fill-opacity', [
                            "case",
                            ["==", ["get", "count"], 0], 0, // Hide only buildings with count = 0
                            0
                        ]);
                    }
                });

                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false
                });

                function addPopupEvent(layerName) {
                    map.on('mousemove', layerName, (e) => {
                        const properties = e.features[0].properties;
                        const density = properties.count || 0; // Ensure this is properly defined
                        const buildingName = properties.building_name || "Unknown Building";
                        const studentCount = properties.studentCount || 0; // Ensure it exists
                        const distance = properties.distance !== undefined ? properties.distance.toFixed(2) + " km" : "N/A";

                        // Compute risk from properties
                        const risk = properties.count || 0; // Risk is stored in "count"

                        const coordinates = e.lngLat;
                        
                        popup.setLngLat(coordinates)
                            .setHTML(`
                                <b>${buildingName}</b><br>
                                <b>Risk:</b> ${risk.toFixed(2)}<br>
                                <b>Students:</b> ${studentCount}<br>
                                <b>Distance:</b> ${distance}
                            `)
                            .addTo(map);
                    });

                    
                    map.on('mouseleave', layerName, () => {
                        popup.remove();
                    });
                }
                
                addPopupEvent('heatmap-radial');
                addPopupEvent('heatmap-buildings');

            } else {
                //console.log("Updating existing heatmap...")
                map.getSource('heatmap').setData({
                    type: "FeatureCollection",
                    features: features
                });
            }
        }
    </script>
    
    <script>

        function removeHeatmapLayer() {
            // Remove the layers first
            if (map.getLayer('heatmap-radial')) {
                map.removeLayer('heatmap-radial');
            }
            if (map.getLayer('heatmap-buildings')) {
                map.removeLayer('heatmap-buildings');
            }
            if (map.getLayer('heatmap-buildings-labels')) {
                map.removeLayer('heatmap-buildings-labels');
            }

            if (map.getSource('heatmap')) {
                map.removeSource('heatmap');
            }
        }


        let heatmapVisible = false;

        function toggleHeatmap() {
            heatmapVisible = !heatmapVisible;

            const dropdownContainer = document.getElementById('weekday-dropdown-container');
            const sliderContainer = document.getElementById("time-slider-container")
            const button = document.getElementById("toggle-heatmap-btn")
            const heatmapLegend = document.getElementById('heatmap-legend');

            if (heatmapVisible) {
                dropdownContainer.style.display = "block";
                sliderContainer.style.display = "block";
                heatmapLegend.style.display = 'block';
                button.innerText = "Hide Heatmap";
                button.classList.add("active");
                addHeatmapLayer();
            } else {
                dropdownContainer.style.display = "none";
                sliderContainer.style.display = "none";
                heatmapLegend.style.display = 'none';
                button.innerText = "Show Heatmap";
                button.classList.remove("active");
                removeHeatmapLayer();
            }
        }

        function updateWeekday(weekday) {
            currentWeekday = weekday;
            //console.log("Selected Weekday: ", currentWeekday);

            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


        function updateTime(time) {

            let hour = Math.floor(time);
            let minutes = Math.round((time - hour) * 60);
            
            currentTime = `${hour}:${minutes.toString().padStart(2, '0')}`;
            
            document.getElementById("time-display").innerText = currentTime;
            //console.log("Selected Time: ", currentTime);
            
            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


    </script>
