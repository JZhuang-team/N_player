        .sidebar {
            background-color: #ffffff;

        .sidebar h5 {
            margin-bottom: 20px;

        .legend-item {

        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;

        /* Map area section */
        .map-area {
            flex-grow: 1;

            background-color: #e6e6e6;
        }

            background-color: #007bff;
            color: white;
            margin-right: 10px;
        }

        .map-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
        }

        /* Footer for map-related actions (like "Create Report") */

            position: absolute;
            bottom: 10px;
            left: 20px;
            background-color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);

                    const layerSlider = document.getElementById('total_layers');
                    const numberOfLayers = parseInt(layerSlider.value, 10);

                    if (numberOfLayers === 1) {
                        map.setLayoutProperty('building-layer', 'visibility', 'visible');
                        map.setLayoutProperty('road-layer', 'visibility', 'none');
                    } else if (numberOfLayers === 2) {
                        map.setLayoutProperty('building-layer', 'visibility', 'visible');
                        map.setLayoutProperty('road-layer', 'visibility', 'visible');

                // Set initial visibility based on the default slider value

                fetch('/api/metrics')
                    .then(response => response.json())
                    .then(data => {
                        const investments = data.investment; // Assuming this is an array of investment values
                        const maxInvestment = Math.max(...investments);
                        const minInvestment = Math.min(...investments);
                        // Invert the line width calculation so higher investments have thicker lines
                        const getLineWidth = investment => {
                            const ratio = (investment - minInvestment) / (maxInvestment - minInvestment);
                            return 30 - (ratio * 10); // Inverts the scale: higher investment results in thicker line
                        };
                        // Ensure you are updating an existing layer
                        if (map.getLayer('building-layer')) {
                            investments.forEach((investment, index) => {
                                // Ensure the layer name is correct
                                map.setPaintProperty('building-layer', 'line-width', getLineWidth(investment));
                            });
                        } else {

                    .catch(error => console.error('Error fetching investment data:', error));

                            <b>Threat: </b>${metrics.threat[0]}

                });

                // Cursor style change on hover

                    map.getCanvas().style.cursor = 'pointer';
                });
                map.on('mouseleave', 'building-layer', function () {
                    map.getCanvas().style.cursor = '';
                });
                map.on('mouseenter', 'road-layer', function () {
                    map.getCanvas().style.cursor = 'pointer';

});

            function fetchData(dataType) {

                    .then(response => response.json())

                        switch (dataType) {
