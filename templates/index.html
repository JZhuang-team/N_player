                        const minInvestment = Math.min(...investments);
                        // Invert the line width calculation so higher investments have thicker lines
                        const getLineWidth = investment => {
                            const ratio = (investment - minInvestment) / (maxInvestment - minInvestment);
                            return 30 - (ratio * 10); // Inverts the scale: higher investment results in thicker line
                        };
                        // Ensure you are updating an existing layer
                        if (map.getLayer('building-layer')) {
                            investments.forEach((investment, index) => {

                    .then(response => response.json())
                    .then(data => {

                        if (data.layers === 1) {
                            tableHead.innerHTML = '<tr><th>Parameter</th><th>Layer 1</th></tr>';

                        }

                        const tableBody = document.getElementById('parametersTable').getElementsByTagName('tbody')[0];
                        tableBody.innerHTML = '';

                        // Define the order in which rows should appear
                        const order = ['vulnerability', 'threat', 'consequence', 'risk', 'investment'];

                        order.forEach(key => {
                            if (data[key] !== undefined) {
                                let row = tableBody.insertRow();
                                let cellName = row.insertCell(0);
                                // Capitalize the first letter of the parameter name
                                cellName.innerHTML = key.charAt(0).toUpperCase() + key.slice(1);

                                // Check if the data for this key is an array
                                if (Array.isArray(data[key])) {
                                    if (data.layers === 1) {

                                        let cell = row.insertCell(1);
                                        cell.innerHTML = Number.isFinite(data[key][0])

                                            : data[key][0];
                                    } else {
                                        // Add a cell for each layer

                                            cell.innerHTML = Number.isFinite(value)
                                                ? value.toLocaleString()
                                                : value;
                                        });
                                    }
                                } else {

            .catch(error => console.error('Error fetching CSV data:', error));

        // Process CSV Data and Convert to GeoJSON
        function processCSVData(data) {
            let geoJSONData = {};

            data.forEach(row => {
                let time = row.Time;
        
                
                if (!geoJSONData[time]) {
                    geoJSONData[time] = [];
                }

                // Process each location for the current time
                Object.keys(row).forEach(location => {
                    if (location !== "Time") {
                        let count = parseInt(row[location]) || 0;
                        if (location in locationCoordinates) {
                            geoJSONData[time].push({
                                type: "Feature",
                                geometry: {
                                    type: "Point",
                                    coordinates: locationCoordinates[location]
                                },
                                properties: {
                                    count: count
                                }
                            });
                        }
                    }
                });
            });

            studentDensityData = geoJSONData;

            addHeatmapLayer();
        }


        const locationCoordinates = {
            "Academ": [-78.784393, 43.009101], "Alfier": [-78.787108, 42.999924], "Alumni": [-78.781268, 43.000370],
            "Baird": [-78.784439, 43.000057], "Baldy": [-78.786982, 43.000493], "Bell": [-78.787036, 43.001517],
            "Bonner": [-78.788146, 43.001535], "Capen": [-78.789566, 43.000899], "CFA": [-78.782852, 43.000953],
            "Clemen": [-78.785007, 43.000421], "Cooke": [-78.791437, 42.999958], "Davis": [-78.787253, 43.002752],
            "Frnczk": [-78.791203, 43.001235], "Furnas": [-78.787096, 43.001927], "Grein": [-78.785320, 43.006544],
            "Hoch": [-78.790764, 42.999941], "Jacobs": [-78.786973, 42.999546], "Jarvis": [-78.787084, 43.002328],
            "Ketter": [-78.788202, 43.002563], "Knox": [-78.787744, 43.001018], "Math": [-78.792770, 43.001205],
            "Norton": [-78.788556, 43.001074], "Nsc": [-78.791720, 43.000707], "Obrian": [-78.788007, 43.000376],
            "Park": [-78.787941, 42.999755], "Slee": [-78.783992, 43.000371], "Spaulding": [-78.784249, 43.009584],
            "Talbert": [-78.790412, 43.000681], "Wilkeson": [-78.784019, 43.008842]
        };

        function addHeatmapLayer() {

            let timeKey = currentHour;

            if (!map.getSource('heatmap')) {
                map.addSource('heatmap', {
                    type: 'geojson',
                    data: {
                        type: "FeatureCollection",
                        features: studentDensityData[timeKey] || []
                    }
                });

                map.addLayer({
                    id: 'heatmap-layer',
                    type: 'heatmap',
                    source: 'heatmap',
                    paint: {
                        'heatmap-weight': ["interpolate", ["linear"], ["get", "count"], 0, 0, 3000, 1],
                        'heatmap-intensity': ["interpolate", ["linear"], ["zoom"], 0, 1, 15, 3],
                        'heatmap-color': [
                            "interpolate",
                            ["linear"],
                            ["heatmap-density"],
                            0, "rgba(0, 0, 255, 0)",
                            0.2, "blue",
                            0.4, "cyan",
                            0.6, "lime",
                            0.8, "yellow",
                            1, "red"
                        ],
                        'heatmap-radius': ["interpolate", ["linear"], ["zoom"], 0, 5, 15, 70],
                        'heatmap-opacity': 0.7
                    }
                });

                map.addLayer({
                    id: 'density-points',
                    type: 'circle',
                    source: 'heatmap',
                    minzoom: 14,
                    paint: {
                        'circle-radius': ['interpolate', ['linear'], ['zoom'], 14, 4, 18, 10],
                        'circle-color': 'white',
                        'circle-opacity': 0
                    }
                });

                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false
                });

                map.on('mousemove', 'density-points', (e) => {
                const density = e.features[0].properties.count;
                const coordinates = e.features[0].geometry.coordinates.slice();

                popup.setLngLat(coordinates)
                    .setHTML(`<b>Student Count:</b> ${density}`)
                    .addTo(map);
                });

                map.on('mouseleave', 'density-points', () => {
                    popup.remove();
                });

            } else {
                console.log("Updating existing heatmap...")
                map.getSource('heatmap').setData({
                    type: "FeatureCollection",
                    features: studentDensityData[timeKey] || []
                });
            }
        }

        function removeHeatmapLayer() {
            if (map.getLayer('heatmap-layer')) {
                map.removeLayer('heatmap-layer');
            }
            if (map.getSource('heatmap')) {
                map.removeSource('heatmap');
            }
        }

        let heatmapVisible = false;

        function toggleHeatmap() {
            heatmapVisible = !heatmapVisible;
            const sliderContainer = document.getElementById("time-slider-container")
            const button = document.getElementById("toggle-heatmap-btn")

            if (heatmapVisible) {
                sliderContainer.style.display = "block";
                button.innerText = "Hide Heatmap";
                button.classList.add("active");
                addHeatmapLayer();
            } else {
                sliderContainer.style.display = "none";
                button.innerText = "Show Heatmap";
                button.classList.remove("active");
                removeHeatmapLayer();
            }
        }


        function updateTime(hour) {
            if (hour == 12) {
                currentHour = "12PM"
            } else if (hour > 12) {
                currentHour = `${hour - 12}PM`;
            } else {
                currentHour = `${hour}AM`;
            }
            
            document.getElementById("time-display").innerText = currentHour;
            
            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


    </script>
</body>
</html>
