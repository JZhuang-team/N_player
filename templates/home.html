<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Index Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    
    <script src="https://api.tiles.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
    <link
      href="https://api.tiles.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='home.css') }}">
</head>
<body>
    <div class="topnav">
        <a href="{{url_for('index')}}">Campus Case</a>
        <a href="{{ url_for('boston_map')}}">Boston Transit Case</a>
      </div>
    <div class="main-content">
        <div class="sidebar">
            <div class="form-container">
                <div class="page-header">
                    <h2></h2>
                </div>

                <form action="/results" method="post">
                    <div class="form-group">
                        <label for="total_layers" class="sidebarHeaders">Number of Layers:</label>
                        <div class="button-container" style="padding-bottom: 5%;">
                            <button type="button" class="btn btn-primary" id="layer1_btn" onclick="setLayer(1)">1 Layer</button>
                            <button type="button" class="btn btn-secondary" id="layer2_btn" onclick="setLayer(2)">2 Layers</button>
                        </div>
                        <input type="hidden" name="total_layers" id="total_layers" value="1">
                    </div>

                    <div class="form-group">
                        <label class="sidebarHeaders" for="resourceType">Resource Type:</label>
                        <select class="form-control" id="resourceType" name="resource_type">
                            <option value="">Select a resource</option>
                            <option value="guards">Guards</option>
                            <option value="camera">Camera</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label class="sidebarHeaders" for="locationSearch">Buildings:</label>
                        <input type="text" class="form-control" id="locationSearch" placeholder="Search for a building...">
                        <div class="dropdown">
                            <div class="dropdown-menu" id="locationDropdown" style="display: none; width: 100%; max-height: 200px; overflow-y: auto;"></div>
                        </div>
                    </div>
                    

                    <div class="form-group">
                        <label for="C_bar_init" class="sidebarHeaders">Resource (K/$):</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="C_bar_init" id="C_bar_init" min="0" max="500" step="5" value="0" oninput="syncSlider('C_bar_init')">
                            <input type="number" id="C_bar_init_input" min="0" max="500" value="0" step="5" oninput="syncInput('C_bar_init')">
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="sidebarHeaders">Spawn Marker: </label>
                        <div>
                            <button type="button" class="btn btn-primary spawnMarker">Spawn</button>
                            <button type="button" class="btn btn-primary clearMarker">Clear</button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label class="sidebarHeaders" for="attackTypes">Attack Types:</label>
                        <select class="form-control" id="attackTypes" name="attack_type[]">
                            <option value="">Select Attack Type</option>
                            <option value="Type1">Shooting</option>
                            <option value="Type2">Kidnapping</option>
                            <option value="Type3">Arson and Explosive Threat</option>
                            <option value="Type4">Sexual Assault</option>
                            <option value="Type5">Vehicular Assault</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary submitButtons">Submit</button>
                </form>

            </div>
            
            <!-- Heatmap Button -->
            <button id="toggle-heatmap-btn" class="btn mt-3" onclick="toggleHeatmap()">Show Heatmap</button>

            <!-- Heatmap Weekday Dropdown -->
            <div id="weekday-dropdown-container" style="display: none; position: absolute; bottom: 290px; left: 10px; background:white; padding:10px; border-radius:5px; z-index:1000; margin-top: 10px;">
                <label for="weekday-dropdown"><b>Weekday:</b></label>
                <select id="weekday-dropdown" onchange="updateWeekday(this.value)">
                    <option value="Monday">Monday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Wednesday">Wednesday</option>
                    <option value="Thursday">Thursday</option>
                    <option value="Friday">Friday</option>
                </select>
            </div>

            <!-- Heatmap Time Slider -->
            <div id="time-slider-container" style="display: none; position:absolute; left:10px; background:white; padding:10px; border-radius:5px; z-index:1000; margin-top: 10px;">
                <label for="time-slider"><b>Time:</b></label>
                <input type="range" id="time-slider" min="8" max="22" step="0.25" value="8" oninput="updateTime(this.value)">
                <span id="time-display">8:00</span>
            </div>
        </div>
        <div class="map-area">
            <div id="map" class="map-canvas"></div>
            <pre id="coordinates" class="coordinates"></pre>
        </div>

        <div class="map-view-buttons">
            <div class="btn-group btn-group-horizontal" role="group" aria-label="Map Style Buttons">
                <button type="button" class="btn btn-map" onclick="switchView('streets-v11')">Streets</button>
                <button type="button" class="btn btn-map" onclick="switchView('satellite-streets-v11')">Satellite</button>
                <button type="button" class="btn btn-map" id="toggle-dark-light" onclick="toggleDarkLight()">Light</button>
            </div>
        </div>

    </div>

    <script>
        // Marker
        let currentMarkers = [];
        const coordinatesElement = document.getElementById('coordinates');

        // Spawn button
        document.querySelector('.spawnMarker').addEventListener('click', function() {
            // Create marker
            const marker = new mapboxgl.Marker({
                draggable: true
            })
            .setLngLat(map.getCenter())
            .addTo(map);

            // Store reference
            currentMarkers.push(marker);

            // Add drag and drop
            marker.on('dragend', function() {
                const lngLat = marker.getLngLat();
                coordinatesElement.style.display = 'block';
                coordinatesElement.innerHTML = `Longitude: ${lngLat.lng.toFixed(5)}<br />Latitude: ${lngLat.lat.toFixed(5)}`;
            });

            // Show coordinates
            const initialLngLat = marker.getLngLat();
            coordinatesElement.style.display = 'block';
            coordinatesElement.innerHTML = `Longitude: ${initialLngLat.lng.toFixed(5)}<br />Latitude: ${initialLngLat.lat.toFixed(5)}`;
        });

        // Clear button
        document.querySelector('.clearMarker').addEventListener('click', function() {
            currentMarkers.forEach(marker => marker.remove());
            currentMarkers = [];
            coordinatesElement.style.display = 'none';
        });
    </script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            let locations = [];
        
            // Fetch data 
            fetch('/data/markers')
                .then(response => response.json())
                .then(data => {
                    locations = data.results.map(location => ({
                        id: location.locationid,
                        title: location.title,
                        coordinates: location.latlng // [lat, lng]
                    }));
                })
                .catch(error => console.error('Error loading locations:', error));
        
            const searchInput = document.getElementById('locationSearch');
            const dropdownMenu = document.getElementById('locationDropdown');
        
            // Update dropdown menu
            function updateDropdown(searchTerm) {
                dropdownMenu.innerHTML = ''; // Clear previous results
                if (!searchTerm) {
                    dropdownMenu.style.display = 'none';
                    return;
                }
        
                const filteredLocations = locations.filter(location =>
                    location.title.toLowerCase().includes(searchTerm.toLowerCase())
                );
        
                if (filteredLocations.length === 0) {
                    dropdownMenu.style.display = 'none';
                    return;
                }
        
                filteredLocations.forEach(location => {
                    const option = document.createElement('div');
                    option.classList.add('dropdown-item');
                    option.textContent = location.title;
                    option.dataset.id = location.id; // Store ID
                    option.dataset.lat = location.coordinates[0]; // Store Latitude
                    option.dataset.lng = location.coordinates[1]; // Store Longitude
        
                    option.addEventListener('click', function () {
                        searchInput.value = location.title;  
                        dropdownMenu.style.display = 'none';  
                        
                        // Log selected location's coordinates
                        console.log(`Selected Location: ${location.title}`);
                        console.log(`Coordinates: ${location.coordinates[0]}, ${location.coordinates[1]}`);
                        
                        // move
                        flyToLocation(location.coordinates);
                    });
        
                    dropdownMenu.appendChild(option);
                });
        
                dropdownMenu.style.display = 'block';  
            }
        
            // Fly + add marker
            let currMarkers = [];
            function flyToLocation(coordinates) {
                currMarkers.forEach(marker => marker.remove());
                currMarkers = [];

                const [lat, lng] = coordinates; 
                map.flyTo({ center: [lng, lat], zoom: 15 });  

                const marker = new mapboxgl.Marker({color: "#FF0000"}).setLngLat([lng, lat]).addTo(map);

                currMarkers.push(marker);
            }
        
            // Input 
            searchInput.addEventListener('input', function () {
                updateDropdown(this.value);
            });
        
            // Hide dropdown
            document.addEventListener('click', function (event) {
                if (!searchInput.contains(event.target) && !dropdownMenu.contains(event.target)) {
                    dropdownMenu.style.display = 'none';
                }
            });
        });
    </script>
    

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG9yamVlbGEiLCJhIjoiY20yZjV0ajVjMDVuNjJycHU5cmVoaWgzNSJ9.sKLqnfQLnaIrXYKpfht6aw'; // Replace with your Mapbox access token
        const map = new mapboxgl.Map({
            container: 'map', 
            style: 'mapbox://styles/dorjeela/cm2f5v601008p01nxfdd725ms', 
            center: [-78.787, 43],
            zoom: 15
        });

        function switchView(styleId) {
            var styleUrl = 'mapbox://styles/mapbox/' + styleId;
            if (map) {
                map.setStyle(styleUrl);
                map.on('style.load', function() {
                    addMapLayersAndSources();
                    });
                }
        }

        // Function to toggle between dark and light views
        function toggleDarkLight() {
            const toggleButton = document.getElementById('toggle-dark-light');
            const currentText = toggleButton.innerText;

            if (currentText === 'Light') {
                switchView('dark-v10'); // Switch to dark view
                toggleButton.innerText = 'Dark'; // Update button text
            } else {
                switchView('light-v10'); // Switch to light view
                toggleButton.innerText = 'Light'; // Update button text
            }
        }


        function setLayer(layer) {
            document.getElementById("total_layers").value = layer;
            updateButtonStyles(layer);
            localStorage.setItem("selectedLayer", layer);
            console.log("layer value is : " + typeof(layer) + layer)
            console.log(localStorage.getItem('selectedLayer'))
        }

        function updateButtonStyles(layer) {
            document.getElementById("layer1_btn").className = layer === 1 ? "btn btn-primary" : "btn btn-secondary";
            document.getElementById("layer2_btn").className = layer === 2 ? "btn btn-primary" : "btn btn-secondary";
        }

        // Maintain resource input syncing functions
        function syncSlider(id) {
            const slider = document.getElementById(id);
            const input = document.getElementById(id + '_input');
            input.value = slider.value;

            if (id === 'C_bar_init') {
                localStorage.setItem('C_bar_init', slider.value);
            }
        }

        function syncInput(id) {
            const input = document.getElementById(id + '_input');
            const slider = document.getElementById(id);

            if (id === 'total_layers') {
                let value = parseInt(input.value);
                if (value < 1) value = 1;
                if (value > 2) value = 2;
                setLayer(value); // Ensure buttons update
            } else {
                slider.value = input.value;
            }
        }


        function toggleLayer(layerName) {
            var visibility = map.getLayoutProperty(layerName, 'visibility');
            if (visibility === 'visible') {
                map.setLayoutProperty(layerName, 'visibility', 'none');
            } else {
                map.setLayoutProperty(layerName, 'visibility', 'visible');
            }
        }

        let studentDensityData = {};
        let currentTime = "8:00";; // Default hour
        let currentWeekday = "Monday";

        // Fetch CSV Data from Flask API
        fetch('/api/student-density')
            .then(response => response.json())
            .then(data => {
                    studentDensityData = data;
                    console.log("Fetched Data:", studentDensityData);
                    processCSVData(studentDensityData);
                })
            .catch(error => console.error('Error fetching CSV data:', error));

        // Process CSV Data and Convert to GeoJSON
        function processCSVData(data) {
            let geoJSONData = {}; // Initialize the structured dataset

            data.forEach(row => {
                const { Building, Time, Weekday, Student_Count_Building } = row;

                if (!geoJSONData[Weekday]) {
                    geoJSONData[Weekday] = {}; // Initialize the weekday if not present
                }

                if (!geoJSONData[Weekday][Time]) {
                    geoJSONData[Weekday][Time] = {}; // Initialize time slot if not present
                }

                // Store student count for the building inside the respective time slot
                geoJSONData[Weekday][Time][Building] = Student_Count_Building;
            });

            //console.log("Processed Student Density Data:", geoJSONData);

            studentDensityData = geoJSONData;
        }


        const locationCoordinates = {
            "Academ": [-78.784393, 43.009101], "Alfier": [-78.787108, 42.999924], "Alumni": [-78.781268, 43.000370],
            "Baird": [-78.784439, 43.000057], "Baldy": [-78.786982, 43.000493], "Bell": [-78.787036, 43.001517],
            "Bonner": [-78.788146, 43.001535], "Capen": [-78.789566, 43.000899], "CFA": [-78.782852, 43.000953],
            "Clemen": [-78.785007, 43.000421], "Cooke": [-78.791437, 42.999958], "Davis": [-78.787253, 43.002752],
            "Frnczk": [-78.791203, 43.001235], "Furnas": [-78.787096, 43.001927], "Grein": [-78.785320, 43.006544],
            "Hoch": [-78.790764, 42.999941], "Jacobs": [-78.786973, 42.999546], "Jarvis": [-78.787084, 43.002328],
            "Ketter": [-78.788202, 43.002563], "Knox": [-78.787744, 43.001018], "Math": [-78.792770, 43.001205],
            "Norton": [-78.788556, 43.001074], "Nsc": [-78.791720, 43.000707], "Obrian": [-78.788007, 43.000376],
            "Park": [-78.787941, 42.999755], "Slee": [-78.783992, 43.000371], "Spaulding": [-78.784249, 43.009584],
            "Talbert": [-78.790412, 43.000681], "Wilkeson": [-78.784019, 43.008842]
        };

        function addHeatmapLayer() {

            let timeKey = currentTime;
            let weekdayKey = currentWeekday;

            //console.log("Time Key: ", timeKey);  // Log to check
            //console.log("Weekday Key: ", weekdayKey);  // Log to check

            let rawData = studentDensityData[weekdayKey] && studentDensityData[weekdayKey][timeKey] ? studentDensityData[weekdayKey][timeKey] : {};
            
            //console.log("Features to be added to heatmap:", rawData);

            let features = Object.keys(rawData).map(Building => {
                if (locationCoordinates[Building]) {
                    let [lon, lat] = locationCoordinates[Building];
                    let count = rawData[Building];

                    let sizeFactor = Math.min(0.00003 + count * 0.000005, 0.0004); // Smaller size

                    let rectCoordinates = [
                        [lon - sizeFactor, lat - sizeFactor * 0.6], // Bottom-left
                        [lon + sizeFactor, lat - sizeFactor * 0.6], // Bottom-right
                        [lon + sizeFactor, lat + sizeFactor * 0.6], // Top-right
                        [lon - sizeFactor, lat + sizeFactor * 0.6], // Top-left
                        [lon - sizeFactor, lat - sizeFactor * 0.6]  // Closing point
                    ];

                    return {
                        type: "Feature",
                        geometry: {
                            type: "Polygon",
                            coordinates: [rectCoordinates]
                        },
                        properties: {
                            count: count
                        }
                    };
                }
                return null; // Ignore buildings without coordinates
            }).filter(feature => feature !== null); // Remove null entries

            if (!map.getSource('heatmap')) {
                map.addSource('heatmap', {
                    type: 'geojson',
                    data: {
                        type: "FeatureCollection",
                        features: features || []
                    }
                });

                map.addLayer({
                    id: 'heatmap-layer',
                    type: 'fill',
                    source: 'heatmap',
                    paint: {
                        'fill-color': [
                            "interpolate",
                            ["linear"],
                            ["get", "count"],
                            0, "rgba(0, 0, 255, 0.3)",
                            50, "green",
                            100, "yellow",
                            200, "orange",
                            400, "red",
                            800, "darkred"
                        ],
                        'fill-opacity': 0.7
                    }
                });

                const popup = new mapboxgl.Popup({
                    closeButton: false,
                    closeOnClick: false
                });

                map.on('mousemove', 'heatmap-layer', (e) => {
                const density = e.features[0].properties.count;
                const coordinates = e.lngLat;

                popup.setLngLat(coordinates)
                    .setHTML(`<b>Student Count:</b> ${density}`)
                    .addTo(map);
                });

                map.on('mouseleave', 'heatmap-layer', () => {
                    popup.remove();
                });

            } else {
                console.log("Updating existing heatmap...")
                map.getSource('heatmap').setData({
                    type: "FeatureCollection",
                    features: features
                });
            }
        }

        function removeHeatmapLayer() {
            if (map.getLayer('heatmap-layer')) {
                map.removeLayer('heatmap-layer');
            }
            if (map.getSource('heatmap')) {
                map.removeSource('heatmap');
            }
        }

        let heatmapVisible = false;

        function toggleHeatmap() {
            heatmapVisible = !heatmapVisible;

            const dropdownContainer = document.getElementById('weekday-dropdown-container');
            const sliderContainer = document.getElementById("time-slider-container")
            const button = document.getElementById("toggle-heatmap-btn")

            if (heatmapVisible) {
                dropdownContainer.style.display = "block";
                sliderContainer.style.display = "block";
                button.innerText = "Hide Heatmap";
                button.classList.add("active");
                addHeatmapLayer();
            } else {
                dropdownContainer.style.display = "none";
                sliderContainer.style.display = "none";
                button.innerText = "Show Heatmap";
                button.classList.remove("active");
                removeHeatmapLayer();
            }
        }

        function updateWeekday(weekday) {
            currentWeekday = weekday;
            //console.log("Selected Weekday: ", currentWeekday);

            // If the heatmap is visible, update the heatmap to reflect the changes
            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


        function updateTime(time) {

            let hour = Math.floor(time);
            let minutes = Math.round((time - hour) * 60);
            
            currentTime = `${hour}:${minutes.toString().padStart(2, '0')}`;
            
            document.getElementById("time-display").innerText = currentTime;
            //console.log("Selected Time: ", currentTime);
            
            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


    </script>
</body>
</html>
