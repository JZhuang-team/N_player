<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Index Map</title>
    <!-- Link to Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
        <!-- Link to Bootstrap for layout and styling -->
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <!-- Link to Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        /* Basic body styles */
        body {
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        /* Navbar styles for the top navigation bar */
        .navbar {
            background-color: #343a40;
            padding: 10px 20px;
            color: white;
        }
        .navbar .nav-link {
            color: white !important;
        }

        /* Main content area that holds the map and legend */
        .main-content {
            display: flex;
            height: 100vh; /* Full height for the main content area */
        }

        /* Sidebar section that holds the legend */
        .sidebar {
            background-color: #ffffff;
            width: 300px;
            padding: 20px;
            border-right: 1px solid #ddd;
        }
        /* Sidebar header */
        .sidebar h5 {
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Sidebar legend styles */
        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }
        .legend-color {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            border-radius: 3px;
        }

        /* Map area section */
        .map-area {
            flex-grow: 1;
            position: relative;
            background-color: #e6e6e6;
        }

        /* Position of the top-right buttons on the map */
        .map-area .top-right-buttons {
            position: absolute;
            top: 20px;
            right: 20px;
        }

        /* Button styling for map options */
        .btn-map {
            background-color: #007bff;
            color: white;
            margin-right: 10px;
        }

        /* Full screen layout for the map view */
        .map-canvas {
            width: 100%;
            height: 100%;
            background-size: cover;
        }

        /* Footer for map-related actions (like "Create Report") */
        .map-footer {
            position: absolute;
            bottom: 10px;
            left: 20px;
            background-color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        /* Right Sidebar styles */
        .right-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            width: 150px;
            z-index: 1000; /* High z-index to ensure visibility above the map */
        }

        .right-sidebar button {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }

        /* New division for map view buttons */
        .map-view-buttons {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 300px;
            z-index: 1000;
            background: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .map-view-buttons button {
            width: 100%;
            padding: 8px;
            margin-bottom: 5px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
        }

       /* Horizontal button group styling */
        .btn-group-horizontal {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }

        .btn-group-horizontal .btn-map {
            flex: 1; /* Distribute space evenly */
            margin: 0 2px; /* Add small spacing between buttons */
            padding: 8px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 3px;
            transition: background-color 0.3s ease;
        }

        .btn-group-horizontal .btn-map:hover {
            background-color: #0056b3;
        }

        #toggle-heatmap-btn {
            background-color: #28a745;
            color: white;
            font-size: 16px;
            font-weight: bold;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        #toggle-heatmap-btn:hover {
            background-color: #218838;
            transform: scale(1.05);
        }

        #toggle-heatmap-btn.active {
            background-color: #dc3545;
        }

    </style>
</head>
<body>
    <!-- Main Content: Sidebar + Map Area -->
    <div class="main-content">
        
        <!-- Sidebar for the Legend and Map Controls -->
        <div class="sidebar">
            
            <!-- Form container -->
            <div class="form-container">
                <div class="page-header">
                    <h2></h2>
                </div>

                <!-- Model selection form -->
                <form action="/results" method="post">
                    <!-- Model Type selection -->
                    <div class="form-group">
                        <!--
                        <div class="custom-control custom-radio mt-2">
                            <input type="radio" id="stra" name="model_type" class="custom-control-input" value="stra">
                            <label class="custom-control-label" for="stra">Strategic Model</label>
                        </div>
                    -->
                    </div>

                    <!-- Total Layers slider -->
                    <div class="form-group">
                        <label for="total_layers">Total Layers:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="total_layers" id="total_layers" min="1" max="2" value="1" step="1" oninput="syncSlider('total_layers')">
                            <input type="number" id="total_layers_input" min="1" max="10" value="1" oninput="syncInput('total_layers')">
                        </div>
                    </div>

                    <!-- Cost slider -->
                    <div class="form-group">
                        <label for="C_bar_init">Resource:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="C_bar_init" id="C_bar_init" min="0" max="500" step="5" value="0" oninput="syncSlider('C_bar_init')">
                            <input type="number" id="C_bar_init_input" min="0" max="500" value="0" step="5" oninput="syncInput('C_bar_init')">
                        </div>
                    </div>

                    <!-- Attack Type Selection -->
                    <div class="form-group">
                        <label>Attack Types:</label>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="attackType1" name="attack_type[]" value="Type1">
                            <label class="custom-control-label" for="attackType1">Shooting</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="attackType2" name="attack_type[]" value="Type2">
                            <label class="custom-control-label" for="attackType2">Kidnappig</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="attackType3" name="attack_type[]" value="Type3">
                            <label class="custom-control-label" for="attackType3">Arson and Explosive threat</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="attackType4" name="attack_type[]" value="Type4">
                            <label class="custom-control-label" for="attackType4">Sexual Assault</label>
                        </div>
                        <div class="custom-control custom-checkbox">
                            <input type="checkbox" class="custom-control-input" id="attackType5" name="attack_type[]" value="Type5">
                            <label class="custom-control-label" for="attackType5">Vehicular Assault</label>
                        </div>
                    </div>


                    <!-- Submit button -->
                    <button type="submit" class="btn btn-primary">Next -></button>
                </form>
            </div>

            <!-- Heatmap Button -->
            <button id="toggle-heatmap-btn" class="btn mt-3" onclick="toggleHeatmap()">Show Heatmap</button>

            <!-- Heatmap Time Slider -->
            <div id="time-slider-container" style="display: none; position:absolute; left:10px; background:white; padding:10px; border-radius:5px; z-index:1000;">
                <label for="time-slider"><b>Select Time:</b></label>
                <input type="range" id="time-slider" min="8" max="22" step="1" value="8" oninput="updateTime(this.value)">
                <span id="time-display">8 AM</span>
            </div>


        </div>
        
        <!-- Map Area -->
        <div class="map-area">
            <!-- Placeholder for actual map content -->
            <div id="map" class="map-canvas"></div>
        </div>
        
        <div class="map-view-buttons">
            <h6 style="text-align: center;"><b>Change Map Style</b></h6>
            <div class="btn-group btn-group-horizontal" role="group" aria-label="Map Style Buttons">
                <button type="button" class="btn btn-map" onclick="switchView('streets-v11')">Streets</button>
                <button type="button" class="btn btn-map" onclick="switchView('satellite-streets-v11')">Satellite</button>
                <button type="button" class="btn btn-map" id="toggle-dark-light" onclick="toggleDarkLight()">Light</button>
            </div>
        </div>

    </div>

    <!-- JavaScript for Bootstrap -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.3/dist/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG9yamVlbGEiLCJhIjoiY20yZjV0ajVjMDVuNjJycHU5cmVoaWgzNSJ9.sKLqnfQLnaIrXYKpfht6aw'; // Replace with your Mapbox access token
        const map = new mapboxgl.Map({
            container: 'map', 
            style: 'mapbox://styles/dorjeela/cm2f5v601008p01nxfdd725ms', 
            center: [-78.787, 43],
            zoom: 15
        });

        function switchView(styleId) {
            var styleUrl = 'mapbox://styles/mapbox/' + styleId;
            if (map) {
                map.setStyle(styleUrl);
                map.on('style.load', function() {
                    addMapLayersAndSources(); // Re-add layers and sources
                    });
                }
        }

        // Function to toggle between dark and light views
        function toggleDarkLight() {
            const toggleButton = document.getElementById('toggle-dark-light');
            const currentText = toggleButton.innerText;

            if (currentText === 'Light') {
                switchView('dark-v10'); // Switch to dark view
                toggleButton.innerText = 'Dark'; // Update button text
            } else {
                switchView('light-v10'); // Switch to light view
                toggleButton.innerText = 'Light'; // Update button text
            }
        }


        function syncSlider(id) {
            const slider = document.getElementById(id);
            const input = document.getElementById(id + '_input');
            input.value = slider.value;
        }

        function syncInput(id) {
            const input = document.getElementById(id + '_input');
            const slider = document.getElementById(id);
            slider.value = input.value;
        }

        function toggleLayer(layerName) {
            var visibility = map.getLayoutProperty(layerName, 'visibility');
            if (visibility === 'visible') {
                map.setLayoutProperty(layerName, 'visibility', 'none');
            } else {
                map.setLayoutProperty(layerName, 'visibility', 'visible');
            }
        }

        let studentDensityData = {};
        let currentHour = 0; // Default hour
        let heatmapSource = null;
        let heatmapLayer = null;

        // Fetch CSV Data from Flask API
        fetch('/api/student-density')
            .then(response => response.json())
            .then(data => {
                    studentDensityData = data;
                    console.log("Fetched Data:", studentDensityData);
                    processCSVData(studentDensityData);
                })
            .catch(error => console.error('Error fetching CSV data:', error));

        // Process CSV Data and Convert to GeoJSON
        function processCSVData(data) {
            let geoJSONData = {};

            data.forEach(row => {
                let time = row.Time;
        
                
                if (!geoJSONData[time]) {
                    geoJSONData[time] = [];
                }

                // Process each location for the current time
                Object.keys(row).forEach(location => {
                    if (location !== "Time") {
                        let count = parseInt(row[location]) || 0;
                        if (location in locationCoordinates) {
                            geoJSONData[time].push({
                                type: "Feature",
                                geometry: {
                                    type: "Point",
                                    coordinates: locationCoordinates[location]
                                },
                                properties: {
                                    count: count
                                }
                            });
                        }
                    }
                });
            });

            studentDensityData = geoJSONData;

            addHeatmapLayer();
        }


        const locationCoordinates = {
            "Academ": [-78.784393, 43.009101], "Alfier": [-78.787108, 42.999924], "Alumni": [-78.781268, 43.000370],
            "Baird": [-78.784439, 43.000057], "Baldy": [-78.786982, 43.000493], "Bell": [-78.787036, 43.001517],
            "Bonner": [-78.788146, 43.001535], "Capen": [-78.789566, 43.000899], "CFA": [-78.782852, 43.000953],
            "Clemen": [-78.785007, 43.000421], "Cooke": [-78.791437, 42.999958], "Davis": [-78.787253, 43.002752],
            "Frnczk": [-78.791203, 43.001235], "Furnas": [-78.787096, 43.001927], "Grein": [-78.785320, 43.006544],
            "Hoch": [-78.790764, 42.999941], "Jacobs": [-78.786973, 42.999546], "Jarvis": [-78.787084, 43.002328],
            "Ketter": [-78.788202, 43.002563], "Knox": [-78.787744, 43.001018], "Math": [-78.792770, 43.001205],
            "Norton": [-78.788556, 43.001074], "Nsc": [-78.791720, 43.000707], "Obrian": [-78.788007, 43.000376],
            "Park": [-78.787941, 42.999755], "Slee": [-78.783992, 43.000371], "Spaulding": [-78.784249, 43.009584],
            "Talbert": [-78.790412, 43.000681], "Wilkeson": [-78.784019, 43.008842]
        };

        function addHeatmapLayer() {

            let timeKey = currentHour;

            if (!map.getSource('heatmap')) {
                map.addSource('heatmap', {
                    type: 'geojson',
                    data: {
                        type: "FeatureCollection",
                        features: studentDensityData[timeKey] || []
                    }
                });

                map.addLayer({
                    id: 'heatmap-layer',
                    type: 'heatmap',
                    source: 'heatmap',
                    paint: {
                        'heatmap-weight': ["interpolate", ["linear"], ["get", "count"], 0, 0, 3000, 1],
                        'heatmap-intensity': ["interpolate", ["linear"], ["zoom"], 0, 1, 15, 3],
                        'heatmap-color': [
                            "interpolate",
                            ["linear"],
                            ["heatmap-density"],
                            0, "rgba(0, 0, 255, 0)",
                            0.2, "blue",
                            0.4, "cyan",
                            0.6, "lime",
                            0.8, "yellow",
                            1, "red"
                        ],
                        'heatmap-radius': ["interpolate", ["linear"], ["zoom"], 0, 2, 15, 30],
                        'heatmap-opacity': 0.6
                    }
                });
            } else {
                console.log("Updating existing heatmap...")
                map.getSource('heatmap').setData({
                    type: "FeatureCollection",
                    features: studentDensityData[timeKey] || []
                });
            }
        }

        function removeHeatmapLayer() {
            if (map.getLayer('heatmap-layer')) {
                map.removeLayer('heatmap-layer');
            }
            if (map.getSource('heatmap')) {
                map.removeSource('heatmap');
            }
        }

        let heatmapVisible = false;

        function toggleHeatmap() {
            heatmapVisible = !heatmapVisible;
            const sliderContainer = document.getElementById("time-slider-container")
            const button = document.getElementById("toggle-heatmap-btn")

            if (heatmapVisible) {
                sliderContainer.style.display = "block";
                button.innerText = "Hide Heatmap";
                button.classList.add("active");
                addHeatmapLayer();
            } else {
                sliderContainer.style.display = "none";
                button.innerText = "Show Heatmap";
                button.classList.remove("active");
                removeHeatmapLayer();
            }
        }


        function updateTime(hour) {
            if (hour == 12) {
                currentHour = "12PM"
            } else if (hour > 12) {
                currentHour = `${hour - 12}PM`;
            } else {
                currentHour = `${hour}AM`;
            }
            
            document.getElementById("time-display").innerText = currentHour;
            
            if (heatmapVisible) {
                addHeatmapLayer();
            }
        }


    </script>
</body>
</html>
