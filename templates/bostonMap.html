<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Index Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='bostonMap.css') }}">
</head>
<body>
    <div class="topnav">
        <a href="{{ url_for('index') }}">Campus Case</a>
        <a href="{{ url_for('boston_map') }}">Boston Transit Case</a>
    </div>

    <!-- Main Content: Sidebar + Map Area -->
    <div class="main-content">
        <!-- Sidebar for the Legend and Map Controls -->
        <div class="sidebar">
            <!-- Form container -->
            <div class="form-container">
                <div class="page-header">
                    <h2>Boston Transit Case</h2>
                </div>

                <!-- Model selection form -->
                <form action="/bostonMap" method="post">
                    <!-- Time selection -->
                    <div class="resource-type">
                        <label class="sidebarHeaders" for="resourceType">Time:</label>
                        <select class="form-control" id="resourceType" name="resource_type">
                            <option value="VERY_EARLY_MORNING">Very Early Morning</option>
                            <option value="EARLY_AM">Early AM</option>
                            <option value="AM_PEAK">AM Peak</option>
                            <option value="MIDDAY_BASE">Midday Base</option>
                            <option value="MIDDAY_SCHOOL">Midday School</option>
                            <option value="PM_PEAK">PM Peak</option>
                            <option value="EVENING">Evening</option>
                            <option value="LATE_EVENING">Late Evening</option>
                            <option value="NIGHT">Night</option>
                        </select>
                    </div>
                
                    <!-- Budget input -->
                    <div class="form-group">
                        <label for="C_bar_init" class="sidebarHeaders">Budget:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="C_bar_init" id="C_bar_init" min="0" max="10000" step="1"
                                value="{{ C_bar_init }}" oninput="syncSlider('C_bar_init')">
                            <input type="number" id="C_bar_init_input" name="C_bar_init" min="0" max="10000"
                                value="{{ C_bar_init }}" step="1" oninput="syncInput('C_bar_init')">
                        </div>
                    </div>
                      
                    <!-- Number of Attacks input -->
                    <div class="form-group">
                        <label for="num_attacks" class="sidebarHeaders">Number of Attacks:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="num_attacks" id="num_attacks" min="0" max="114" step="1"
                                value="{{ num_attacks }}" oninput="syncSlider('num_attacks')">
                            <input type="number" id="num_attacks_input" name="num_attacks" min="0" max="114"
                                value="{{ num_attacks }}" step="1" oninput="syncInput('num_attacks')">
                        </div>
                    </div>
                
                    <!-- Submit button -->
                    <button type="submit" class="btn btn-primary submitButtons">Submit</button>
                </form>
            </div>
        </div>

        <!-- Map Area -->
        <div class="map-area">
            <div id="map" class="map-canvas"></div>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG9yamVlbGEiLCJhIjoiY20yZjV0ajVjMDVuNjJycHU5cmVoaWgzNSJ9.sKLqnfQLnaIrXYKpfht6aw'; 
    
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/dorjeela/cm2f5v601008p01nxfdd725ms',
            center: [-71.05878548825, 42.366206886],
            zoom: 12
        });
    
        map.on('load', () => {
            // **Add Metro Lines**
            map.addSource('metro-lines', {
                type: 'vector',
                url: 'mapbox://quicksid.0th645in'
            });
    
            map.addLayer({
                id: 'metro-lines-layer',
                type: 'line',
                source: 'metro-lines',
                'source-layer': 'metro_lines-6c89vh',
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': 5,
                    'line-opacity': 0.9
                }
            });
    
            // **Add Metro Stations**
            map.addSource('metro-stations', {
                type: 'vector',
                url: 'mapbox://quicksid.15kqqikj'
            });
    
            map.addLayer({
                id: 'metro-stations-layer',
                type: 'circle',
                source: 'metro-stations',
                'source-layer': 'metro_stations-6hjjow',
                paint: {
                    'circle-radius': 5,
                    'circle-color': '#FFFFFF',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#000000',
                    'circle-opacity': 0.9,
                }
            });
    
            const popup = new mapboxgl.Popup({
                closeButton: false,
                closeOnClick: false
            });
    
            // **Load station data from Flask**
            const stationData = JSON.parse('{{ station_data|tojson|safe }}');
    
            map.on('mousemove', 'metro-stations-layer', (e) => {
                const features = e.features;
                if (!features.length) return;
    
                const feature = features[0];
                const stationName = feature.properties.stop_name;
    
                // Find the station in the dataset (always exists now)
                const stationInfo = stationData.find(s => s.station_name === stationName);
    
                // Construct popup content for all stations
                let popupContent = `<strong>${stationName}</strong>`;
                if (stationInfo) {
                    popupContent += `
                        <br><strong>Attack Probability:</strong> ${stationInfo.attack_probability}
                        <br><strong>Defend Probability:</strong> ${stationInfo.defend_probability}
                        <br><strong>Defense Allocation:</strong> ${stationInfo.defense_allocation}
                    `;
                } else {
                    popupContent += "<br>No Data Available";
                }
    
                popup.setLngLat(e.lngLat)
                    .setHTML(popupContent)
                    .addTo(map);
            });
    
            map.on('mouseleave', 'metro-stations-layer', () => {
                popup.remove();
            });
        });

        
        function syncSlider(id) {
            let slider = document.getElementById(id);
            let numberInput = document.getElementById(id + "_input");
            
            numberInput.value = slider.value;  // Update number input when slider changes
        }

        function syncInput(id) {
            let slider = document.getElementById(id);
            let numberInput = document.getElementById(id + "_input");

            slider.value = numberInput.value;  // Update slider when number input changes
        }

        // Ensure real-time updates between the slider and input
        document.addEventListener("DOMContentLoaded", function () {
            let sliders = document.querySelectorAll(".slider");
            let numberInputs = document.querySelectorAll("input[type='number']");

            sliders.forEach(slider => {
                slider.addEventListener("input", function () {
                    document.getElementById(slider.id + "_input").value = slider.value;
                });
            });

            numberInputs.forEach(input => {
                input.addEventListener("input", function () {
                    document.getElementById(input.id.replace("_input", "")).value = input.value;
                });
            });
        });
    </script>
    
</body>
</html>
