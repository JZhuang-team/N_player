<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Index Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='bostonMap.css') }}">
</head>
<body>
    <div class="topnav">
        <a href="{{ url_for('index') }}">Campus Case</a>
        <a href="{{ url_for('boston_map') }}">Boston Transit Case</a>
    </div>

    <!-- Main Content: Sidebar + Map Area -->
    <div class="main-content">
        <!-- Sidebar for the Legend and Map Controls -->
        <div class="sidebar">
            <!-- Form container -->
            <div class="form-container">
                <div class="page-header">
                    <h2>Boston Transit Case</h2>
                </div>

                <!-- Model selection form -->
                <form action="/bostonMap" method="post">
                    <!-- Time selection -->
                    <div class="resource-type">
                        <label class="sidebarHeaders" for="resourceType">Time:</label>
                        <select class="form-control" id="resourceType" name="resource_type">
                            <option value="" {% if resource_type == "" %}selected{% endif %}>Select a Time</option>
                            <option value="morning" {% if resource_type == 'morning' %}selected{% endif %}>Morning</option>
                            <option value="afternoon" {% if resource_type == 'afternoon' %}selected{% endif %}>Afternoon</option>
                            <option value="night" {% if resource_type == 'night' %}selected{% endif %}>Night</option>
                        </select>
                    </div>

                    <!-- Budget input -->
                    <div class="form-group">
                        <label for="C_bar_init" class="sidebarHeaders">Budget:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="C_bar_init" id="C_bar_init" min="0" max="10000" step="1"
                                value="{{ C_bar_init }}" oninput="syncSlider('C_bar_init')">
                            <input type="number" id="C_bar_init_input" name="C_bar_init" min="0" max="10000"
                                value="{{ C_bar_init }}" step="1" oninput="syncInput('C_bar_init')">
                        </div>
                    </div>

                    <!-- Number of Attacks input -->
                    <div class="form-group">
                        <label for="num_attacks" class="sidebarHeaders">Number of Attacks:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="num_attacks" id="num_attacks" min="0" max="114" step="1"
                                value="{{ num_attacks }}" oninput="syncSlider('num_attacks')">
                            <input type="number" id="num_attacks_input" name="num_attacks" min="0" max="114"
                                value="{{ num_attacks }}" step="1" oninput="syncInput('num_attacks')">
                        </div>
                    </div>



                    <!-- Submit button -->
                    <button type="submit" class="btn btn-primary submitButtons">Submit</button>
                </form>
            </div>
        </div>

        <!-- Map Area -->
        <div class="map-area">
            <div id="map" class="map-canvas"></div>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG9yamVlbGEiLCJhIjoiY20yZjV0ajVjMDVuNjJycHU5cmVoaWgzNSJ9.sKLqnfQLnaIrXYKpfht6aw'; // Replace with your Mapbox access token
        
        const map = new mapboxgl.Map({
            container: 'map', 
            style: 'mapbox://styles/dorjeela/cm2f5v601008p01nxfdd725ms', //'mapbox://styles/mapbox/light-v11', 
            center: [-71.05878548825, 42.366206886],
            zoom: 12
        });
    
        map.on('load', () => {
    
    
            // Add Metro Lines
            map.addSource('metro-lines', {
                type: 'vector',
                url: 'mapbox://quicksid.8o0hrbga'
            });
    
            map.addLayer({
                id: 'metro-lines-layer',
                type: 'line',
                source: 'metro-lines',
                'source-layer': 'metro_lines-2tdkpe',
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': 5,
                    'line-opacity': 0.9
                },
                filter: [
                    'all',
                    ['!=', ['get', 'color'], '#FFC72C'],  // Excluding lines with color '#FFC72C' (Yellow Bus Lines)
                    ['!=', ['get', 'color'], '#008EAA']   // Excluding lines with color '#006595' (Boston Port Ferries)
                ]
            });
    
            // Add Metro Stations
            map.addSource('metro-stations', {
                type: 'vector',
                url: 'mapbox://quicksid.1fwvc521'
            });
    
            map.addLayer({
                id: 'metro-stations-layer',
                type: 'circle',
                source: 'metro-stations',
                'source-layer': 'metro_stations-9wh99v',
                paint: {
                    'circle-radius': 3,
                    'circle-color': '#FFFFFF',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#000000',
                    'circle-opacity': 0.9,
                }
            });
    
            const popup = new mapboxgl.Popup({
                closeButton: false,
                closeOnClick: false
            });
    
            map.on('mousemove', 'metro-stations-layer', (e) => {
                const features = e.features;
                if (!features.length) return;
    
                const feature = features[0];
                const stationName = feature.properties.stop_name;  // Get station name
    
                popup.setLngLat(e.lngLat)
                    .setHTML(`<strong>${stationName}</strong>`)
                    .addTo(map);
            });
    
            map.on('mouseleave', 'metro-stations-layer', () => {
                popup.remove();
            });
        });
    
        function syncSlider(id) {
            document.getElementById(id + "_input").value = document.getElementById(id).value;
        }
    
        function syncInput(id) {
            document.getElementById(id).value = document.getElementById(id + "_input").value;
        }
    
    </script>
</body>
</html>
