<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Risk Index Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.css" rel="stylesheet">
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.7.0/mapbox-gl.js"></script>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='bostonMap.css') }}">
</head>
<body>
    <div class="topnav">
        <a href="{{ url_for('index') }}">Campus Case</a>
        <a href="{{ url_for('boston_map') }}">Boston Transit Case</a>
        <a href="{{ url_for('ubpd') }}">UBPD Case</a>
    </div>

    <div class="main-content">
        <div class="sidebar">
            <div class="form-container">
                <div class="page-header">
                </div>
                <form action="/bostonMap" method="post">
                    <div class="resource-type">
                        <label class="sidebarHeaders" for="resourceType">Time:</label>
                        <select class="form-control" id="resourceType" name="resource_type">
                            <option value="VERY_EARLY_MORNING">Very Early Morning</option>
                            <option value="EARLY_AM">Early AM</option>
                            <option value="AM_PEAK">AM Peak</option>
                            <option value="MIDDAY_BASE">Midday Base</option>
                            <option value="MIDDAY_SCHOOL">Midday School</option>
                            <option value="PM_PEAK">PM Peak</option>
                            <option value="EVENING">Evening</option>
                            <option value="LATE_EVENING">Late Evening</option>
                            <option value="NIGHT">Night</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="C_bar_init" class="sidebarHeaders">Budget:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="C_bar_init" id="C_bar_init" min="0" max="10000" step="1"
                                value="{{ C_bar_init }}" oninput="syncSlider('C_bar_init')">
                            <input type="number" id="C_bar_init_input" name="C_bar_init" min="0" max="10000"
                                value="{{ C_bar_init }}" step="1" oninput="syncInput('C_bar_init')">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="num_attacks" class="sidebarHeaders">Number of Attacks:</label>
                        <div class="slider-container">
                            <input type="range" class="slider" name="num_attacks" id="num_attacks" min="0" max="114" step="1"
                                value="{{ num_attacks }}" oninput="syncSlider('num_attacks')">
                            <input type="number" id="num_attacks_input" name="num_attacks" min="0" max="114"
                                value="{{ num_attacks }}" step="1" oninput="syncInput('num_attacks')">
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <div class="map-area">
            <div id="map" class="map-canvas"></div>
        </div>

        <div class="right-sidebar">
            <h3>Station Data</h3>
            <table class="station-table">
                <thead>
                    <tr>
                        <th>Station Name</th>
                        <th>Defense Allocation</th>
                        <th>Attack Probability</th>
                    </tr>
                </thead>
                <tbody id="station-table-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        mapboxgl.accessToken = 'pk.eyJ1IjoiZG9yamVlbGEiLCJhIjoiY20yZjV0ajVjMDVuNjJycHU5cmVoaWgzNSJ9.sKLqnfQLnaIrXYKpfht6aw'; 
    
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/dorjeela/cm2f5v601008p01nxfdd725ms',
            center: [-71.05878548825, 42.366206886],
            zoom: 12
        });
    
        map.on('load', () => {
            map.addSource('metro-lines', {
                type: 'vector',
                url: 'mapbox://quicksid.0th645in'
            });
            map.addLayer({
                id: 'metro-lines-layer',
                type: 'line',
                source: 'metro-lines',
                'source-layer': 'metro_lines-6c89vh',
                paint: {
                    'line-color': ['get', 'color'],
                    'line-width': 5,
                    'line-opacity': 0.9
                }
            });
    
            map.addSource('metro-stations', {
                type: 'vector',
                url: 'mapbox://quicksid.15kqqikj'
            });
            map.addLayer({
                id: 'metro-stations-layer',
                type: 'circle',
                source: 'metro-stations',
                'source-layer': 'metro_stations-6hjjow',
                paint: {
                    'circle-radius': 5,
                    'circle-color': '#FFFFFF',
                    'circle-stroke-width': 2,
                    'circle-stroke-color': '#000000',
                    'circle-opacity': 0.9,
                }
            });

            let stationData = []; //Initialize

            // Fetch data
            const debounce = (func, delay = 300) => {
                let timer;
                return (...args) => {
                    clearTimeout(timer);
                    timer = setTimeout(() => func.apply(this, args), delay);
                };
            };

            // Fetch data and update UI
            const fetchStationData = debounce(() => {
                const timePeriod = document.getElementById('resourceType').value;
                const budget = document.getElementById('C_bar_init').value;
                const numAttacks = document.getElementById('num_attacks').value;

                fetch(`/get_station_data?resource_type=${encodeURIComponent(timePeriod)}&C_bar_init=${budget}&num_attacks=${numAttacks}`)
                    .then(response => response.json())
                    .then(data => {
                        stationData = data;
                        updateMapAndTable(data);
                    })
                    .catch(error => console.error('Error:', error));
            });


            const updateMapAndTable = (data) => {
                // Remove existing attacked layer
                if (map.getLayer('attacked-stations-layer')) {
                    map.removeLayer('attacked-stations-layer');
                }

                // Add new attacked layer
                const attackedStations = data.filter(station => station.is_attacked).map(station => station.station_name);
                if (attackedStations.length > 0) {
                    map.addLayer({
                        id: 'attacked-stations-layer',
                        type: 'circle',
                        source: 'metro-stations',
                        'source-layer': 'metro_stations-6hjjow',
                        filter: ['in', 'stop_name', ...attackedStations],
                        paint: {
                            'circle-radius': 7,
                            'circle-color': '#FF0000',
                            'circle-stroke-width': 2,
                            'circle-stroke-color': '#000000',
                            'circle-opacity': 0.9
                        }
                    });
                }

                // Update table
                populateStationTable(data, attackedStations);
            };

            // Inputs
            document.getElementById('resourceType').addEventListener('change', fetchStationData);
            document.getElementById('C_bar_init').addEventListener('input', fetchStationData);
            document.getElementById('num_attacks').addEventListener('input', fetchStationData);
            document.querySelector('form').addEventListener('submit', (e) => e.preventDefault());

            fetchStationData();

            const popup = new mapboxgl.Popup({ closeButton: false, closeOnClick: false });
            map.on('mousemove', 'metro-stations-layer', (e) => {
                const stationName = e.features[0].properties.stop_name;
                const station = stationData.find(s => s.station_name === stationName);
                if (station) {
                    popup.setLngLat(e.lngLat)
                        .setHTML(`<strong>${stationName}</strong>
                            <br>Attack Probability: ${station.attack_probability}
                            <br>Defense Allocation: ${station.defense_allocation}`)
                        .addTo(map);
                }
            });
            map.on('mouseleave', 'metro-stations-layer', () => popup.remove());
        
        });   

        function populateStationTable(data, attackedStations) {
            const tableBody = document.getElementById('station-table-body');
            tableBody.innerHTML = '';
            data.forEach(station => {
                const row = document.createElement('tr');
                if (attackedStations.includes(station.station_name)) {
                    row.classList.add('attacked');
                }
                row.innerHTML = `
                    <td>${station.station_name}</td>
                    <td>${station.defense_allocation}</td>
                    <td>${station.attack_probability}</td>
                `;
                tableBody.appendChild(row);
            });
        }

        function syncSlider(id) {
            let slider = document.getElementById(id);
            let numberInput = document.getElementById(id + "_input");
            numberInput.value = slider.value;
            slider.dispatchEvent(new Event('input'));
        }

        function syncInput(id) {
            let slider = document.getElementById(id);
            let numberInput = document.getElementById(id + "_input");
            slider.value = numberInput.value;
            slider.dispatchEvent(new Event('input'));
        }

        document.addEventListener("DOMContentLoaded", function () {
            let sliders = document.querySelectorAll(".slider");
            let numberInputs = document.querySelectorAll("input[type='number']");

            sliders.forEach(slider => {
                slider.addEventListener("input", function () {
                    document.getElementById(slider.id + "_input").value = slider.value;
                });
            });

            numberInputs.forEach(input => {
                input.addEventListener("input", function () {
                    document.getElementById(input.id.replace("_input", "")).value = input.value;
                });
            });
        });
    </script>
    
</body>
</html>
